# WebSocket-aware load balancer + static hosting for the built client.
worker_processes auto;
events { worker_connections 8192; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Realtime: pin every member of a room to the same node by hashing the ?room= query
  # arg. The Redis adapter still fans events out across nodes, but a room's in-memory
  # state lives on exactly one node, which keeps sync latency low and state consistent.
  upstream realtime {
    hash $arg_room consistent;
    server server1:4000 max_fails=2 fail_timeout=5s;
    server server2:4000 max_fails=2 fail_timeout=5s;
  }

  # Plain REST: any node will do (state is in Postgres/Redis)
  upstream api {
    least_conn;
    server server1:4000 max_fails=2 fail_timeout=5s;
    server server2:4000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;
    client_max_body_size 1m;   # uploads go straight to object storage, not through here

    location /socket.io/ {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;   # long-lived connections
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health { proxy_pass http://api/health; }
    location /metrics { return 404; }   # scraped directly on the internal network

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
