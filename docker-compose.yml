# Production-ready stack:  docker compose up -d --build
#   App (nginx: client + REST + WebSocket LB)  127.0.0.1:8080  -> put Caddy/HTTPS in front
#   MinIO S3 API                               127.0.0.1:9000  -> put Caddy/HTTPS in front
#   MinIO console / Prometheus / Grafana       localhost only (use an SSH tunnel)
x-server: &server
  build: { context: ., dockerfile: server/Dockerfile }
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_started }
  environment: &server-env
    NODE_ENV: production
    PORT: "4000"
    CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-0123456789}
    DATABASE_URL: postgres://watchparty:${POSTGRES_PASSWORD:-watchparty}@postgres:5432/watchparty
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    S3_BUCKET: watch-party
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    TRANSCODE_ENABLED: ${TRANSCODE_ENABLED:-false}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}

services:
  nginx:
    build: { context: ., dockerfile: infra/nginx/Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [server1, server2]
    restart: unless-stopped

  server1:
    <<: *server
    environment: { <<: *server-env, NODE_ID: node-1 }
  server2:
    <<: *server
    environment: { <<: *server-env, NODE_ID: node-2 }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchparty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchparty}
      POSTGRES_DB: watchparty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchparty"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    # image: minio/minio:latest
    # image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [server1, server2]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
