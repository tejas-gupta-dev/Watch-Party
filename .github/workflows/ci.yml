name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Typecheck (lint)
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build client
        run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t watch-party-server .
      - name: Build nginx + client image
        run: docker build -f infra/nginx/Dockerfile -t watch-party-web .
